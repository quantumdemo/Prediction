[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "football-ai-platform-web-api"
version = "0.1.0"
description = "Football AI Intelligence & Machine-Learning Platform Web & Serverless API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.1.18",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
ml-worker = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
]
